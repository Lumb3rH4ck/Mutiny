# pre-commit hooks for Mutiny (see TODO.md "Static analysis").
#
# The official duriantaco/skylos hooks only target Python files; Mutiny is a Go
# app with an embedded JS web UI, so we use a local hook that runs the full
# project scan. Requires `skylos` on PATH (e.g. `~/.local/bin/skylos`), matching
# the version in pyproject.toml. Install tooling with:
#   pipx install pre-commit
#   pre-commit install
repos:
  - repo: local
    hooks:
      - id: skylos
        name: skylos static analysis (gate)
        entry: skylos . -a --json --gate
        language: system
        types_or: [go, javascript]
        pass_filenames: false
        require_serial: true