# MUTINY project config for Skylos (https://skylos.dev) — static analysis + PR gate.
#
# Rule-ignore rationale (each rule ID here was verified against this codebase
# in the 2026-09-13 scan; see TODO.md "Static analysis"):
#   SKY-D215   Path traversal — Mutiny is a torrent/Sandbox client: it reads and
#              writes files at user-specified paths by design (torrent saves,
#              scan/clean/quarantine dirs, socket/tmp files). No network-facing
#              input control follows attacker-controlled paths into a privileged
#              location; the exposed surface (localhost / token-gated API) only
#              allows locals.
#   SKY-D216   SSRF — every flagged call fetches a URL the LOCAL user supplied
#              (CLI arg, magnet, handoff socket, rules/database updater). There is
#              no server that accepts attacker-supplied URLs, so there is no
#              server-side request forgery.
#   SKY-D212   Command injection — all hits are `exec.Command(binary, args...)`
#              with NO shell on the path; Go builds argv arrays directly so there
#              is no interpolation. Scanner already pins the executable via
#              TrustedBin/toolLookup, sets pgid, and kills the whole group.
#   SKY-G260   Unclosed resource — updater.zip/tar extraction, copyFile, and the
#              /dev/tty logger all close on every path (verified); the mutiny.log
#              file is intentionally long-lived.
#   SKY-D222   Hallucinated dep — github.com/RoaringBitmap/roaring is a real
#              transparent dep of anacrolix/torrent (builds clean).
#   SKY-D253   Timing-unsafe comparison — the 4 JS hits compare `infohash ===
#              this.rescanning` (display state). Real auth uses
#              subtle.ConstantTimeCompare, already server-side.
#   SKY-S101   Hardcoded secret — hits are the config FIELD name `MBAPIKey`
#              (main.go:172/645); the key itself is loaded from config, never a
#              literal.
#   SKY-D252   Insecure cookie — accepted/rolled forward 2026-09-13 (user
#              decision). The mutiny_token cookie already has HttpOnly + SameSite
#              Strict; adding Secure would only be correct once the web server
#              speaks TLS (it is currently plain HTTP, including LAN access), so
#              it's deferred until TLS lands. Revisit when Mutiny serves HTTPS.

[tool.skylos]
complexity = 10
nesting = 3
max_args = 5
max_lines = 50
god_file_max_lines = 500
god_file_max_definitions = 40
god_file_max_top_level_definitions = 25
duplicate_strings = 3
exclude = []
ignore = [
    "SKY-D215",
    "SKY-D216",
    "SKY-D212",
    "SKY-G260",
    "SKY-D222",
    "SKY-D253",
    "SKY-S101",
    "SKY-D252",
]

# JS dead-code cascade: `app()` is the Alpine entrypoint reached via
# `x-data="app()"` in index.html — skylos can't see the attribute, so `app` and
# everything it calls look unreferenced. Whitelisting the entry + the THEMEKEY
# constant collapses all of it (verified empirically). The per-file override
# below additionally marks every symbol in web/app.js as live for dead-code
# purposes (its wiring is express/HTML attributes the JS analyzer can't see) —
# scoped to that one file, so other JS/Go dead-code checks stay active.
[tool.skylos.whitelist]
names = ["app", "THEMEKEY"]

[tool.skylos.whitelist.documented]

[tool.skylos.whitelist.temporary]

[tool.skylos.overrides."web/app.js"]
whitelist = ["*"]

[tool.skylos.gate]
fail_on_critical = true
max_critical = 0
max_high = 0
max_security = 0
# Quality backlog is real but tracked ("Static analysis" section of TODO.md);
# baseline set to current count so the gate catches only NEW regressions; the
# pre-commit hook enforces the same on every push. Reduce as refactors land.
max_quality = 131
max_secrets = 0
# 43 residual module-level advisories, ALL confirmed non-reachable by our code
# via `govulncheck ./...` (0 reachable). Revisit when upstream publishes fixed
# versions of x/crypto, x/net, x/sys, x/text, otel.
max_dependency_vulnerabilities = 43
max_dead_code = 0
strict = false