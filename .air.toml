root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/mutiny"
  cmd = "go build -o ./tmp/mutiny . && cp ./tmp/mutiny ~/.local/bin/mutiny"
  delay = 1000
  exclude_dir = ["tmp", "web/img", "assets", "build"]
  exclude_file = []
  exclude_regex = []
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "html", "css", "js", "yaml"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
